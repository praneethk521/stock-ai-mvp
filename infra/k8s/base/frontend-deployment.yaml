apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ai-frontend
  labels:
    app.kubernetes.io/name: stock-ai-frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-ai-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-ai-frontend
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/praneethk521/stock-ai-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_BASE_URL
              value: http://stock-ai-backend:8000/api/v1
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: temp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: temp
          emptyDir: {}
