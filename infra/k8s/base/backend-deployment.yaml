apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ai-backend
  labels:
    app.kubernetes.io/name: stock-ai-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-ai-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-ai-backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/praneethk521/stock-ai-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: stock-ai-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stock-ai-runtime
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stock-ai-runtime
                  key: redis_url
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: runtime-secrets
          secret:
            secretName: stock-ai-runtime
            optional: true
            items:
              - key: polygon_api_key
                path: polygon_api_key
              - key: auth_jwt_secret
                path: auth_jwt_secret
